services:
  - type: web
    name: deepseek-agent-studio
    runtime: node
    region: oregon
    plan: free
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NEXT_PUBLIC_BNB_RPC_URL
        value: https://bsc-dataseed.binance.org
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JSONBIN_API_KEY
        sync: false
      - key: POSTHOG_KEY
        sync: false
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: E2B_API_KEY
        sync: false
